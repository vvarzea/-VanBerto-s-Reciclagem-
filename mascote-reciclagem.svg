<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><svg x="16.0" y="21.12" width="480" height="480" viewBox="0 -6 96 96" stroke-linejoin="round" stroke-linecap="round"><style>.vbr-f{display:none}.vbr-f-happy{display:block}</style>
      <defs>
        <linearGradient id="vbrW" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#e3f6e6"/><stop offset="1" stop-color="#a9d9b3"/>
        </linearGradient>
        <linearGradient id="vbrBin" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#9be35d"/><stop offset="0.55" stop-color="#6fcf4a"/><stop offset="1" stop-color="#3fa83a"/>
        </linearGradient>
        <linearGradient id="vbrWaist" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#14532d" stop-opacity="0"/><stop offset="0.4" stop-color="#1b5e36"/><stop offset="1" stop-color="#134a2a"/>
        </linearGradient>
        <linearGradient id="vbrVisor" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9af0b4"/><stop offset="0.5" stop-color="#2fc26a"/><stop offset="1" stop-color="#128a48"/>
        </linearGradient>
        <radialGradient id="vbrHaloG" gradientUnits="userSpaceOnUse" cx="48" cy="5" r="11">
          <stop offset="0" stop-color="#86efac" stop-opacity="0.6"/><stop offset="1" stop-color="#86efac" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vbrBulb" gradientUnits="userSpaceOnUse" cx="48" cy="5" r="5.5" fx="46.3" fy="3.5">
          <stop offset="0" stop-color="#f0fff4"/><stop offset="0.4" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/>
        </radialGradient>
        <clipPath id="vbrBodyClip"><rect x="26" y="44" width="44" height="32" rx="15"/></clipPath>
        <clipPath id="vbrHeadClip"><rect x="26" y="14" width="44" height="34" rx="17"/></clipPath>
        <clipPath id="vbrVisorClip"><rect x="32.5" y="22" width="31" height="19" rx="10"/></clipPath>
        <!-- uma seta da reciclagem (repetida 3×) -->
        <g id="vbrArrow">
          <path d="M48 50.8 A5.2 5.2 0 0 1 52.9 53.6" fill="none" stroke="#fff" stroke-width="1.9"/>
          <polygon points="51.4,52.4 55,52.8 53.2,56" fill="#fff" stroke="none"/>
        </g>
      </defs>

      <g class="vbr-bob">

        <!-- PERNAS -->
        <g class="vbr-legL">
          <rect x="36" y="70" width="10" height="11" rx="4.5" fill="url(#vbrW)" stroke="#0f2a1c" stroke-width="2.6"/>
          <rect x="34.5" y="79" width="13" height="9" rx="4" fill="#14532d" stroke="#0f2a1c" stroke-width="2.6"/>
          <rect x="34.5" y="81" width="13" height="2.4" rx="1.2" fill="#fff" fill-opacity="0.85" stroke="none"/>
        </g>
        <g class="vbr-legR">
          <rect x="50" y="70" width="10" height="11" rx="4.5" fill="url(#vbrW)" stroke="#0f2a1c" stroke-width="2.6"/>
          <rect x="48.5" y="79" width="13" height="9" rx="4" fill="#14532d" stroke="#0f2a1c" stroke-width="2.6"/>
          <rect x="48.5" y="81" width="13" height="2.4" rx="1.2" fill="#fff" fill-opacity="0.85" stroke="none"/>
        </g>

        <!-- BRAÇOS -->
        <g class="vbr-armL">
          <rect x="17" y="52" width="9" height="13" rx="4.5" fill="url(#vbrW)" stroke="#0f2a1c" stroke-width="2.6"/>
          <circle cx="21.5" cy="67" r="5" fill="#14532d" stroke="#0f2a1c" stroke-width="2.3"/>
        </g>
        <g transform="translate(-1 0)"><g transform="rotate(-147 74.5 52)">
          <rect x="70" y="52" width="9" height="13" rx="4.5" fill="url(#vbrW)" stroke="#0f2a1c" stroke-width="2.6"/>
          <circle cx="74.5" cy="67" r="5" fill="#14532d" stroke="#0f2a1c" stroke-width="2.3"/>
        </g></g>

        <!-- CORPO (verde, como um ecoponto) -->
        <rect x="26" y="44" width="44" height="32" rx="15" fill="url(#vbrBin)"/>
        <g clip-path="url(#vbrBodyClip)">
          <rect x="26" y="64" width="44" height="14" fill="url(#vbrWaist)" stroke="none"/>
          <line x1="28" y1="65" x2="68" y2="65" stroke="#0f2a1c" stroke-opacity="0.55" stroke-width="2"/>
          <ellipse cx="36" cy="52" rx="9" ry="5.5" transform="rotate(-28.6 36 52)" fill="#fff" fill-opacity="0.45" stroke="none"/>
        </g>
        <rect x="26" y="44" width="44" height="32" rx="15" fill="none" stroke="#0f2a1c" stroke-width="3"/>

        <!-- SÍMBOLO DA RECICLAGEM NO PEITO (roda devagar) -->
        <circle cx="48" cy="56" r="8.2" fill="#14532d" stroke="#0f2a1c" stroke-width="2.5"/>
        <g class="vbr-spin">
          <use xlink:href="#vbrArrow"/>
          <use xlink:href="#vbrArrow" transform="rotate(120 48 56)"/>
          <use xlink:href="#vbrArrow" transform="rotate(240 48 56)"/>
        </g>

        <!-- ORELHAS -->
        <circle cx="25" cy="32" r="6" fill="#14532d" stroke="#0f2a1c" stroke-width="2.3"/>
        <circle cx="25" cy="32" r="2.8" fill="#86efac" stroke="none"/>
        <circle cx="71" cy="32" r="6" fill="#14532d" stroke="#0f2a1c" stroke-width="2.3"/>
        <circle cx="71" cy="32" r="2.8" fill="#86efac" stroke="none"/>

        <!-- ANTENA -->
        <polygon points="45,16 51,16 49.2,8 46.8,8" fill="#14532d" stroke="none"/>
        <circle class="vbr-halo" cx="48" cy="5" r="11" fill="url(#vbrHaloG)" stroke="none"/>
        <circle cx="48" cy="5" r="5.5" fill="url(#vbrBulb)" stroke="none"/>
        <circle cx="46.2" cy="3.4" r="1.6" fill="#fff" stroke="none"/>

        <!-- CABEÇA (com "tampa" de ecoponto) -->
        <rect x="26" y="14" width="44" height="34" rx="17" fill="url(#vbrW)" stroke="#0f2a1c" stroke-width="3"/>
        <g clip-path="url(#vbrHeadClip)">
          <ellipse cx="38" cy="19" rx="10" ry="4" transform="rotate(-28.6 38 19)" fill="#fff" fill-opacity="0.6" stroke="none"/>
        </g>

        <!-- VISEIRA -->
        <rect x="30" y="20" width="36" height="23" rx="12" fill="#14532d" stroke="none"/>
        <rect x="32.5" y="22" width="31" height="19" rx="10" fill="url(#vbrVisor)" stroke="none"/>
        <g clip-path="url(#vbrVisorClip)">
          <ellipse cx="42" cy="25" rx="9" ry="3.5" transform="rotate(-22.9 42 25)" fill="#fff" fill-opacity="0.45" stroke="none"/>
        </g>

        <!-- CARA: expressões -->
        <g class="vbr-f vbr-f-normal">
          <g class="vbr-eyes" stroke="none">
            <ellipse cx="41" cy="30" rx="3.3" ry="4" fill="#06190f"/><ellipse cx="55" cy="30" rx="3.3" ry="4" fill="#06190f"/>
            <circle cx="42.3" cy="28.4" r="1.5" fill="#fff"/><circle cx="39.9" cy="31" r="0.8" fill="#fff"/>
            <circle cx="56.3" cy="28.4" r="1.5" fill="#fff"/><circle cx="53.9" cy="31" r="0.8" fill="#fff"/>
          </g>
          <g class="vbr-mouth">
            <path d="M43.4 36 A4.6 3.2 0 0 0 52.6 36 Z" fill="#06190f" stroke="none"/>
            <path d="M45.6 37.4 A2.4 1.5 0 0 0 50.4 37.4 Z" fill="#ff7a7a" stroke="none"/>
          </g>
        </g>

        <g class="vbr-f vbr-f-wink">
          <g class="vbr-eyes" stroke="none">
            <ellipse cx="41" cy="30" rx="3.3" ry="4" fill="#06190f"/>
            <circle cx="42.3" cy="28.4" r="1.5" fill="#fff"/><circle cx="39.9" cy="31" r="0.8" fill="#fff"/>
          </g>
          <g class="vbr-wr-open" stroke="none">
            <ellipse cx="55" cy="30" rx="3.3" ry="4" fill="#06190f"/>
            <circle cx="56.3" cy="28.4" r="1.5" fill="#fff"/><circle cx="53.9" cy="31" r="0.8" fill="#fff"/>
          </g>
          <path class="vbr-wr-arc" opacity="0" d="M58.12 32.59 A3.5 3.5 0 0 1 51.88 32.59" fill="none" stroke="#06190f" stroke-width="3"/>
          <g class="vbr-mouth">
            <path d="M42.4 36 A5.6 3.6 0 0 0 53.6 36 Z" fill="#06190f" stroke="none"/>
            <path d="M45.1 37.6 A2.9 1.7 0 0 0 50.9 37.6 Z" fill="#ff7a7a" stroke="none"/>
          </g>
        </g>

        <g class="vbr-f vbr-f-happy">
          <path d="M44.71 32.2 A3.9 3.9 0 0 1 37.29 32.2 M58.71 32.2 A3.9 3.9 0 0 1 51.29 32.2" fill="none" stroke="#06190f" stroke-width="3.2"/>
          <circle cx="33.5" cy="35.5" r="3" fill="#ff7878" fill-opacity="0.55" stroke="none"/>
          <circle cx="62.5" cy="35.5" r="3" fill="#ff7878" fill-opacity="0.55" stroke="none"/>
          <g class="vbr-mouth">
            <path d="M41.8 36 A6.2 4.2 0 0 0 54.2 36 Z" fill="#06190f" stroke="none"/>
            <path d="M44.8 38 A3.2 1.9 0 0 0 51.2 38 Z" fill="#ff7a7a" stroke="none"/>
          </g>
        </g>

        <g class="vbr-f vbr-f-think">
          <g transform="translate(2 -1.4)" stroke="none">
            <ellipse cx="41" cy="30" rx="3.3" ry="4" fill="#06190f"/><ellipse cx="55" cy="30" rx="3.3" ry="4" fill="#06190f"/>
            <circle cx="42.3" cy="28.4" r="1.5" fill="#fff"/><circle cx="56.3" cy="28.4" r="1.5" fill="#fff"/>
          </g>
          <path d="M44.5 38.3 Q48 38.8 51.5 36.6" fill="none" stroke="#06190f" stroke-width="2.3"/>
        </g>

      </g>
    </svg></svg>